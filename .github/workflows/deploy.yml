name: Enterprise Deployment Pipeline

on:
  push:
    branches:
      - develop
      - staging
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy to DEV
        if: github.ref == 'refs/heads/develop'
        run: |
          cd C:\Apps\MyPythonApp_DEV
          git pull origin develop
          venv\Scripts\pip install -r requirements.txt
          C:\nssm\nssm.exe restart MyApp_DEV

      - name: Deploy to UAT
        if: github.ref == 'refs/heads/staging'
        run: |
          cd C:\Apps\MyPythonApp_UAT
          git pull origin staging
          venv\Scripts\pip install -r requirements.txt
          C:\nssm\nssm.exe restart MyApp_UAT

      - name: Deploy to PROD
        if: github.ref == 'refs/heads/main'
        run: |
          cd C:\Apps\MyPythonApp_PROD
          git pull origin main
          venv\Scripts\pip install -r requirements.txt
          C:\nssm\nssm.exe restart MyApp_PROD